<!doctype html>
<!--
  Toni's walk-in. A transparent, click-through strip across the screen; Swift positions it and calls
  window.walk({ svg, fromX, toX, y, duration, flip }). Toni walks from fromX to toX (px inside the
  strip), fading in, then posts "arrived" to webkit.messageHandlers.walker.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #toni { position: absolute; top: 0; left: 0; width: 96px; height: 96px; color: #2B2420; opacity: 0; will-change: transform; }
  @media (prefers-color-scheme: dark) { #toni { color: #F6F1EE; } }
  #toni svg { width: 96px; height: 96px; display: block; }
  #toni.flip svg { transform: scaleX(-1); }
</style>
</head>
<body>
<div id="toni"></div>
<script>
  let arriveTimer = null;
  window.walk = function (p) {
    const t = document.getElementById("toni");
    t.innerHTML = p.svg || "";
    t.classList.toggle("flip", !!p.flip);
    t.style.transition = "none";
    t.style.opacity = "0";
    t.style.transform = `translate(${p.fromX}px, ${p.y}px)`;
    void t.offsetWidth;
    t.style.transition = `transform ${p.duration}s cubic-bezier(.3, 0, .55, 1), opacity .3s ease`;
    t.style.opacity = "1";
    t.style.transform = `translate(${p.toX}px, ${p.y}px)`;
    clearTimeout(arriveTimer);
    arriveTimer = setTimeout(() => {
      const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.walker;
      if (h) h.postMessage("arrived");
    }, p.duration * 1000);
  };
</script>
</body>
</html>
